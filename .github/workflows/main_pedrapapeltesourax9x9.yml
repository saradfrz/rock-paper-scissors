name: Build and deploy WAR app to Azure Web App - pedrapapeltesourax9x9

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pedrapapeltesourax9x9-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build and test with Maven
        run: mvn --batch-mode clean verify

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: pedrapapeltesourax9x9
          slot-name: production
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_fe11cfe5d019473b9a5ec2aaf6707233 }}
          package: '${{ github.workspace }}/target/*.war'
