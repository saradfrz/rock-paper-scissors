name: Build and deploy WAR app to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Build with Maven
        run: mvn -B clean install

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pedrapapeltesourax9x9'
          slot-name: 'production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_fe11cfe5d019473b9a5ec2aaf6707233 }}
          package: '${{ github.workspace }}/target/*.war'